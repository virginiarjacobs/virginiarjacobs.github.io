<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} — Virginia R. Jacobs</title>
<meta property="og:image" content="https://virginiarjacobs.github.io/photo-6bc032c2.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/covers.css?v=20261021">
<script src="/languages.js?v=20261021" defer></script>
<script src="/covers.js?v=20261021" defer></script>
<style>
.wave{isolation:isolate;}
.velvet-stage{position:absolute;inset:0;z-index:5;overflow:hidden;border-radius:.3rem;pointer-events:none;}
.velvet-panel{position:absolute;top:0;bottom:0;width:51%;height:100%;background-color:var(--bg);background-image:none;border-bottom:6px double var(--fg);box-shadow:none;transition:transform 1.3s cubic-bezier(.25,.7,.2,1);}
.velvet-left{left:0;transform-origin:top left;}.velvet-right{right:0;transform-origin:top right;}
.velvet-stage.open .velvet-left{transform:translateX(-101%) scaleX(.75) skewY(-3deg);}.velvet-stage.open .velvet-right{transform:translateX(101%) scaleX(.75) skewY(3deg);}
.covers-page .title-burst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;}
.covers-page .cover-player > h2,
.covers-page .title-burst { visibility: hidden; }
.covers-page input.seek{position:relative;}
.covers-page .wave:focus-within{outline:3px dashed #00ffff;outline-offset:5px;box-shadow:0 0 0 4px #000,0 0 0 8px #fff,0 0 0 11px #000;}
@media(prefers-reduced-motion:reduce){.velvet-panel{transition:none;}}

#swirl-warning{background:#000;color:#fff;text-align:center;padding:12px 8px}#swirl-warning strong{display:block;color:#ff0;font-size:clamp(2rem,5vw,4rem);text-shadow:0 0 5px #ff0,0 0 12px #ff0,0 0 24px #ff0}#swirl-warning p{margin:.4rem 0 0;color:#fff;font-size:clamp(1.25rem,2.5vw,2rem);font-weight:700}main .cover-player>h2{display:none}.cover-player .wave{height:clamp(420px,70vw,620px);overflow:hidden;background:#000}.wave #viz{display:block;width:100%;height:100%;background:#000}.motion{margin:1rem 0}.motion p{margin:0 0 .75rem}.motion .performance-notice{font-size:.875rem;font-weight:400;margin:.75rem 0 0;color:inherit;text-shadow:none}.phone-notice{display:none}.desktop-notice{display:block}#error{min-height:1.5em}button:focus-visible{outline:3px solid #c8a6ff;outline-offset:3px}@media(max-width:700px){.cover-player .wave{height:420px}.phone-notice{display:block}.desktop-notice{display:none}}
</style>
</head>
<body class="covers-page" data-song="{{ page.song | escape }}">
<div id="swirl-warning"><strong>WARNING</strong><p>May cause seizures in some people.</p></div>
<a class="skip-link" href="#tracks" data-cover-text="skip">Skip to main content</a>
<div class="container">
<header>
<a href="/covers.html" data-cover-text="backSetlist">Back to Song Covers</a>
<h1>{{ page.title | escape }}</h1>
<p data-cover-text="subtitle">Unreleased covers, shared here for you.</p>
</header>
<main id="tracks" tabindex="-1"></main>
<footer><p data-cover-text="footer">All covers performed by Virginia R. Jacobs. Original songs belong to their respective rights holders.</p></footer>
<div id="display-controls" class="display-panel" role="region" aria-label="Font Size Display Controls">
<p id="display-label">Display Adjustment:</p>
<div class="control-row">
<button id="btn-increase-font" type="button" aria-label="Increase text size for entire website">Increase Text Size</button>
<button id="btn-reset-font" type="button" aria-label="Reset text size to default">Reset Text Size</button>
<button id="btn-light-mode" type="button" role="switch" aria-checked="false" aria-label="Light mode"><span id="light-label">Light mode</span> <span id="theme-state" aria-hidden="true">Off</span></button>
<div class="menu-control"><button id="contrast-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="contrast-menu">Change Contrast</button><div id="contrast-menu" class="menu" role="menu" aria-label="Change Contrast" hidden></div></div>
<div class="menu-control"><button id="language-trigger" type="button" aria-label="Switch Languages" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu"><span class="globe" aria-hidden="true">◎</span> <span id="language-label">Languages</span></button><div id="language-menu" class="menu" role="menu" aria-label="Switch Languages" hidden></div></div>
</div>
</div>
<p id="player-status" class="sr-only" role="status" aria-live="polite"></p>
</div>
<script>
(()=>{'use strict';const tracks=document.getElementById('tracks');function mount(){const card=tracks.querySelector('.cover-player');if(!card)return;observer.disconnect();const wave=card.querySelector('.wave'),audio=card.querySelector('audio'),oldButton=card.querySelector('.playback-controls .play-button:not(.skip-back):not(.skip-forward)');if(!wave||!audio||!oldButton)return;const canvas=document.createElement('canvas');canvas.id='viz';canvas.setAttribute('aria-hidden','true');wave.querySelectorAll('canvas:not(.title-burst)').forEach(node=>node.remove());wave.prepend(canvas);card.querySelectorAll('.seek,.skip-back,.skip-forward,.time').forEach(node=>node.remove());audio.id='song';audio.crossOrigin='anonymous';const button=oldButton.cloneNode(true);button.id='play';oldButton.replaceWith(button);const restart=document.createElement('button');restart.id='restart';restart.type='button';restart.textContent='Restart swirl sequence';const state=document.createElement('span');state.id='state';state.className='sr-only';state.setAttribute('role','status');state.setAttribute('aria-live','polite');state.textContent='Ready';card.querySelector('.playback-controls').append(restart,state);wave.insertAdjacentHTML('afterend',"<div id=\"swirl-description\" style=\"font-size:14px;line-height:1.5;color:inherit;padding:12px 16px;text-shadow:none\"><p style=\"margin:0 0 6px\">Fixed audio-reactive morph loop</p><p style=\"margin:0\">This canvas is decorative and reacts to the music. Every pass follows the same sequence: resting spiral, beat burst, star regroup, return to spiral. No two passes look the same. Stop, end, replay, or restart resets the swirl for a fresh pass.</p></div>");card.insertAdjacentHTML('beforeend',"<div class=\"motion\"><p>Turning on Reduce Motion will keep the animation static, while turning off Reduce Motion will give you full animation.</p><button id=\"reduce\" type=\"button\" aria-pressed=\"false\">Reduce Motion: Off</button><p class=\"performance-notice phone-notice\">Visuals may lag on some handheld devices. For a better viewing experience, please use desktop.</p><p class=\"performance-notice desktop-notice\">Warning: continuous playback may cause computer lag. This is expected.</p></div>"+'<p id="error" role="status" aria-live="polite"></p>');const syncLabel=()=>{const text=oldButton.textContent,label=oldButton.getAttribute('aria-label')||text;if(button.textContent!==text)button.textContent=text;if(button.getAttribute('aria-label')!==label)button.setAttribute('aria-label',label);};const labelObserver=new MutationObserver(syncLabel);[oldButton,button].forEach(node=>labelObserver.observe(node,{childList:true,attributes:true,subtree:true,characterData:true}));window.__desktopDiag={record(){},begin(){}};const script=document.createElement('script');script.src='/swirl.js';script.onload=syncLabel;script.onerror=()=>{document.getElementById('error').textContent='The swirl player could not load.';};document.body.append(script);}const observer=new MutationObserver(mount);observer.observe(tracks,{childList:true});mount();})();
</script>
<script>
(function(){
const tracks=document.getElementById('tracks');
const decorate=()=>tracks.querySelectorAll('.cover-player:not([data-curtain])').forEach(card=>{
const wave=card.querySelector('.wave'),audio=card.querySelector('audio');if(!wave||!audio)return;
if(matchMedia('(prefers-reduced-motion:reduce)').matches){card.dataset.curtain='reduced-motion';return;}
card.dataset.curtain='ready';
const overlay=document.createElement('canvas');overlay.className='title-burst';overlay.setAttribute('aria-hidden','true');
const curtain=document.createElement('div');curtain.className='velvet-stage';curtain.setAttribute('aria-hidden','true');curtain.innerHTML='<div class="velvet-panel velvet-left"></div><div class="velvet-panel velvet-right"></div>';wave.append(overlay,curtain);
audio.addEventListener('playing',()=>{ curtain.classList.add('open');card.dataset.curtain='opened';card.dataset.titleSequence='playing'; const w=Math.max(1,Math.round(wave.clientWidth)),h=Math.max(1,Math.round(wave.clientHeight));overlay.width=w;overlay.height=h; const ctx=overlay.getContext('2d'),mask=document.createElement('canvas');mask.width=w;mask.height=h; const pen=mask.getContext('2d'),title=card.querySelector('h2').textContent.replace(/ - (?:MIDI|QWS) cover$/,'').toUpperCase(); let size=Math.min(h*.43,56);pen.font='900 '+size+'px monospace'; while(pen.measureText(title).width>w-24&&size>10){size--;pen.font='900 '+size+'px monospace';} pen.fillStyle='#fff';pen.textAlign='center';pen.textBaseline='middle';pen.fillText(title,w/2,h/2); const pixels=pen.getImageData(0,0,w,h).data,points=[],step=matchMedia('(prefers-reduced-motion:reduce)').matches?6:4; for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step)if(pixels[(y*w+x)*4+3]>100)points.push({x,y,dx:(Math.random()-.5)*w*.6,dy:(Math.random()-.5)*h*1.8,hue:Math.random()*360}); const start=performance.now(); const render=now=>{ const t=now-start;ctx.fillStyle=getComputedStyle(document.body).backgroundColor;ctx.fillRect(0,0,w,h); const bg=getComputedStyle(document.body).backgroundColor,fg=getComputedStyle(document.body).color; if(t<1650){ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle=fg;for(const p of points)ctx.fillRect(p.x,p.y,step-1,step-1);} else{ const burst=Math.min(1,(t-1650)/350),settle=Math.max(0,Math.min(1,(t-2000)/600)),ease=1-Math.pow(1-burst,3);ctx.globalAlpha=1; points.forEach((p,i)=>{const bx=p.x+p.dx*ease,by=p.y+p.dy*ease,targetX=(i/points.length)*w,targetY=h/2+Math.sin(i*.4)*h*.25;ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg') || '#ffffff';ctx.fillRect(bx*(1-settle)+targetX*settle,by*(1-settle)+targetY*settle,step,step);});ctx.globalAlpha=1; } if(t>=2600){overlay.remove();card.dataset.titleSequence='finished';return;}requestAnimationFrame(render); };requestAnimationFrame(render); },{once:true});
});
new MutationObserver(decorate).observe(tracks,{childList:true});decorate();
})();
</script>
</body>
</html>
