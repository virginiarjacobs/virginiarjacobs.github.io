<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Virginia R. Jacobs</title>
</head>
<body>
  <header>
    <div class="font-control-region" role="region" aria-label="Font Size Display Controls">
      <div class="control-btn-group">
        <button type="button" class="accessible-btn" id="btn-increase-font" aria-label="Increase text size for entire website">Increase Text Size</button>
        <button type="button" class="accessible-btn" id="btn-reset-font" aria-label="Reset text size to default">Reset Text Size</button>
        <button type="button" class="accessible-btn" id="btn-light-mode" role="switch" aria-checked="false" aria-label="Light mode">Light mode <span class="theme-switch-track" aria-hidden="true"></span> <span id="theme-state" aria-hidden="true">Off</span></button>
        <div class="language-control">
          <button type="button" class="accessible-btn language-trigger" id="language-trigger" aria-label="Switch Languages" aria-haspopup="true" aria-expanded="false" aria-controls="language-menu">
            <span aria-hidden="true">🌐</span>
            Languages
          </button>
          <ul class="language-menu" id="language-menu" role="menu" hidden>
            <li role="none"><button type="button" role="menuitem" data-language="en">English</button></li>
            <li role="none"><button type="button" role="menuitem" data-language="es">Espanol (Spanish)</button></li>
            <li role="none"><button type="button" role="menuitem" data-language="fr">Francais</button></li>
            <li role="none"><button type="button" role="menuitem" data-language="zh-CN">Simplified Chinese</button></li>
          </ul>
        </div>
      </div>
    </div>
  </header>
  <script src="languages.js?v=5" defer></script>
</body>
</html>
