<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song Covers — Virginia R. Jacobs</title>
<meta property="og:image" content="https://virginiarjacobs.github.io/photo-6bc032c2.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="covers.css?v=5">
<script src="covers.js?v=5" defer></script>
<style>
/* Curtains are decorative, pointer-transparent and confined to the waveform. */
.curtains{position:absolute;inset:0;overflow:hidden;border-radius:.3rem;pointer-events:none;}
.curtain{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#650717 0%,#ba1734 10%,#e34050 17%,#8b0b22 25%);border-bottom:4px solid #d9b35a;box-shadow:inset 0 6px 12px #480012;transform-origin:top left;transition:transform 1.3s cubic-bezier(.25,.7,.2,1);}
.curtain.left{left:0}.curtain.right{right:0;transform-origin:top right;}
.curtains.open .left{transform:translateX(-101%) scaleX(.75) skewY(-3deg)}
.curtains.open .right{transform:translateX(101%) scaleX(.75) skewY(3deg)}
.covers-page input.seek{z-index:2;}
@media(prefers-reduced-motion:reduce){.curtain{transition:none;}}
</style>
</head>
<body class="covers-page">
<div class="container">
<header>
<a href="/" data-cover-text="back">Back to Virginia R. Jacobs</a>
<h1 data-cover-text="heading">Song Covers</h1>
<p data-cover-text="subtitle">Unreleased covers, shared here for you.</p>
<div id="display-controls" class="display-panel" role="region" aria-label="Font Size Display Controls">
<p id="display-label">Display Adjustment:</p>
<div class="control-row">
<button id="btn-increase-font" type="button" aria-label="Increase text size for entire website">Increase Text Size</button>
<button id="btn-reset-font" type="button" aria-label="Reset text size to default">Reset Text Size</button>
<button id="btn-light-mode" type="button" role="switch" aria-checked="false" aria-label="Light mode"><span id="light-label">Light mode</span> <span id="theme-state" aria-hidden="true">Off</span></button>
<div class="menu-control"><button id="contrast-trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="contrast-menu">Change Contrast</button><div id="contrast-menu" class="menu" role="menu" aria-label="Change Contrast" hidden></div></div>
<div class="menu-control"><button id="language-trigger" type="button" aria-label="Switch Languages" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu"><span class="globe" aria-hidden="true">◎</span> <span id="language-label">Languages</span></button><div id="language-menu" class="menu" role="menu" aria-label="Switch Languages" hidden></div></div>
</div>
</div>
</header>
<main id="tracks"></main>
<footer><p data-cover-text="footer">All covers performed by Virginia R. Jacobs. Original songs belong to their respective rights holders.</p></footer>
<p id="player-status" class="sr-only" role="status" aria-live="polite"></p>
</div>
<script>
(function(){
 const tracks=document.getElementById('tracks');
 const decorate=()=>tracks.querySelectorAll('.cover-player:not([data-curtain])').forEach(card=>{
  card.dataset.curtain='ready';const curtain=document.createElement('div');curtain.className='curtains';curtain.setAttribute('aria-hidden','true');curtain.innerHTML='<span class="curtain left"></span><span class="curtain right"></span>';card.querySelector('.wave').append(curtain);
  card.querySelector('audio').addEventListener('playing',()=>{curtain.classList.add('open');card.dataset.curtain='opened';},{once:true});
 });
 new MutationObserver(decorate).observe(tracks,{childList:true});decorate();
})();
</script>
</body>
</html>
